# The built site behind nginx, with content negotiation (html / markdown / plain text per URL).
#
#   docker compose up -d --build --wait     # http://localhost:8080
#   NGINX_PORT=127.0.0.1:9000 docker compose up -d --build   # another port / only on localhost
#   docker compose down
#
# This file publishes no host port, so a platform with its own reverse proxy (e.g. Coolify, whose
# proxy already holds :8080) can deploy it as is and route a domain to the container's port 8080.
# The host port for local use is in compose.override.yaml, which `docker compose` loads
# automatically when no -f is given (platforms that pass `-f compose.yaml` skip it).
#
# Image: docker/web.Dockerfile. nginx config: docker/nginx/default.conf.
# To serve a folder from the host instead of the site built into the image (no rebuild), add
# docker/compose.site.yaml (see there).
name: shipmoth

services:
  nginx:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: shipmoth/web:local
    # nginx listens on 8080 inside the container (it runs as an unprivileged user)
    expose:
      - "8080"
    restart: unless-stopped
    # nothing in the image needs to be written: pid and temp files go to /tmp, logs to stdout/stderr
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # same check as the image's HEALTHCHECK; repeated so `up --wait` sees it with these timings
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
      start_interval: 1s
