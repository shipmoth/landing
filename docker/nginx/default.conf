# shipmoth site: every page is one URL (/, /about/) with several representations on disk
# (index.html, index.md, index.txt, index.ansi) and nginx picks one per request. See the README,
# "Docker / nginx".
#
# This file is /etc/nginx/conf.d/default.conf, which the image's nginx.conf includes inside http {},
# so the maps below are at http level. The image is nginx-unprivileged: it runs as uid 101 and
# keeps its pid and temp files in /tmp, hence port 8080 (compose maps it to the host).

# --- negotiation -------------------------------------------------------------------------------

# 1. The format the Accept header asks for. The regexes are tried in the order written and the first
#    one that matches wins; q-values are not parsed. So an Accept naming several of these gets the
#    first in this list (md, then txt, then html), whatever their q: "text/html, text/markdown" -> md.
#    Anything else (missing, */*, text/*, application/json, ...) leaves it empty: no 406, the
#    fallback below decides, because every client can read at least one of our formats.
map $http_accept $requested_format {
    default          "";
    ~*text/markdown  "md";
    ~*text/plain     "txt";
    ~*text/html      "html";
}

# 2. The fallback when Accept names none of them: terminal clients get the coloured text (index.ansi:
#    the plain text with 256-colour escapes; `Accept: text/plain` gets it without), everything else
#    (browsers, crawlers, link previews) gets html.
map $http_user_agent $fallback_format {
    default          "html";
    ~*^curl/         "ansi";
    ~*^wget(/|$)     "ansi";   # GNU "Wget/1.21.4", busybox "Wget"
    ~*^httpie/       "ansi";
}

# 3. The index files for a directory URL, tried in order by the `index` directive below: the chosen
#    one, then $index_second, then index.html. So a page without index.ansi gives a terminal its
#    index.txt, and a page without the chosen file at all gives its index.html. (One variable holds
#    one file name, hence two.)
map "$requested_format:$fallback_format" $index_file {
    ~^md:            "index.md";
    ~^txt:           "index.txt";
    ~^html:          "index.html";
    ~^:ansi$         "index.ansi";
    default          "index.html";
}
map $index_file $index_second {
    index.ansi       "index.txt";
    default          "index.html";
}

# --- response headers --------------------------------------------------------------------------
# Set once at server level from these variables: an add_header inside a location would silently
# drop every server-level add_header for that location. An empty value adds no header.

# Vary only on the negotiated URLs (the request path ends in "/"). $request_uri is the request as
# received, so it is still "/about/" after `index` has internally redirected to /about/index.md.
map $request_uri $negotiated_vary {
    ~^[^?]*/(\?|$)   "Accept, User-Agent";
    default          "";
}

# Documents: one URL serves several representations, and a cache only keys on Vary, so make every
# cache revalidate (cheap: ETag / Last-Modified give a 304). Other files (favicon.svg) have stable
# names but no content hash, so a day. $uri is the file actually served (/about/index.md).
map $uri $file_cache_control {
    ~\.(html|md|txt|ansi)$  "no-cache";
    default                 "public, max-age=86400";
}
map $status $cache_control {
    200              $file_cache_control;
    206              $file_cache_control;
    304              $file_cache_control;
    301              "public, max-age=3600";
    default          "";
}

# The old site's URLs.
map $request_uri $legacy_redirect {
    ~^/index\.html(\?|$)  "/";
    ~^/about\.html(\?|$)  "/about/";
    default               "";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Location: /about/ rather than http://localhost:8080/about/: behind Docker's port mapping or a
    # proxy nginx does not know the public host and port.
    absolute_redirect off;

    # a types block here replaces the http-level one, so mime.types is included again; it already
    # maps txt to text/plain (repeating that here only earns a "duplicate extension" warning).
    # index.ansi is text/plain too: curl prints it, and a browser shows it rather than downloading it.
    include /etc/nginx/mime.types;
    types {
        text/markdown  md;
        text/plain     ansi;
    }
    charset utf-8;
    charset_types text/plain text/markdown text/css application/javascript;   # (+ text/html, always)

    # *.gz files are made at image build time (gzip -9); gzip on covers anything without one.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/markdown text/css application/javascript application/json image/svg+xml;

    index $index_file $index_second index.html;

    add_header Vary $negotiated_vary always;
    add_header Cache-Control $cache_control;
    add_header X-Content-Type-Options nosniff always;

    # keyed on $request_uri (what the client actually asked for), not $uri, so only a client's own
    # /index.html or /about.html is redirected, never the internal /index.html that `index` serves /
    # with. ($uri would happen to work today, since nginx evaluates a map once per request, but that
    # is an implementation detail to not lean on.)
    if ($legacy_redirect) {
        return 301 $legacy_redirect$is_args$args;
    }

    location / {
        # /about -> 301 /about/ (a directory); /about/ -> index; /about/index.md -> that file
        try_files $uri $uri/ =404;
    }

    # the precompressed copies are only served through gzip_static, not by name
    location ~ \.gz$ {
        return 404;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store";
        return 200 "ok\n";
    }
}
